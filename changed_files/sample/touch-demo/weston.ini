# Installed as /etc/xdg/weston/weston.ini by "./build.sh sample".
# Adds a panel launcher for touch-demo next to the default terminal launcher.

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/local/bin/touch-demo
