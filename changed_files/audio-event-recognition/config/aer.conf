# Audio event recognition - configuration shared by all aer-* modules.
# Installed as /etc/aer/aer.conf. Restart the pipeline after editing:
#   sudo systemctl restart aer.target
#
# Format: [section] headers and "key = value" lines. Comments must start the
# line with '#'. Values run to the end of the line.

[general]
# Name sent in MQTT messages and shown on the display. Empty: the hostname.
device_name =
# Directory holding the module sockets (<run_dir>/<module>/<module>.sock).
# The AER_RUN_DIR environment variable overrides it (handy for manual runs).
run_dir = /run/aer

# ---------------------------------------------------------------- module 1
[capture]
# ALSA device of the microphone. The COMS CM420 registers as card "CM420".
# Use the raw hw device: format conversion is done by aer-preprocess.
device = hw:CM420,0
# Native format of the CM420: 16-bit stereo at 44100 or 48000 Hz.
rate = 48000
channels = 2
# Samples are sent to aer-preprocess once per period.
period_ms = 50
buffer_periods = 8

# ---------------------------------------------------------------- module 2
[preprocess]
# Linear gain applied after the int16 -> [-1.0, 1.0] conversion.
gain = 1.0
# -1: average all channels to mono; 0, 1, ...: use only that channel.
channel = -1

# ---------------------------------------------------------------- module 3
[framer]
# YAMNet TFLite input: 15600 samples = 0.975 s at 16 kHz, every 0.48 s.
frame_samples = 15600
hop_samples = 7680

# ---------------------------------------------------------------- module 4
[infer]
model = /usr/local/share/aer/yamnet.tflite
threads = 2

# ---------------------------------------------------------------- module 5
[detect]
labels = /usr/local/share/aer/yamnet_labels.txt
# Threshold for [event] sections that do not set their own.
default_threshold = 0.3
# The same event type is not reported again within this many seconds.
cooldown_sec = 5

# Event types: "[event <name>]". The event score is the highest score of
# the listed YAMNet classes (names as in yamnet_labels.txt, separated by '|';
# class numbers work too). Up to 16 event types.

[event siren]
threshold = 0.3
classes = Siren | Civil defense siren | Police car (siren) | Ambulance (siren) | Fire engine, fire truck (siren)

[event breaking]
threshold = 0.3
classes = Glass | Shatter | Smash, crash | Breaking

[event alarm]
threshold = 0.3
classes = Alarm | Smoke detector, smoke alarm | Fire alarm | Car alarm

[event explosion]
threshold = 0.3
classes = Explosion | Gunshot, gunfire

[event scream]
threshold = 0.3
classes = Screaming

# ---------------------------------------------------------------- module 6-1
[display]
# Seconds the red alert banner stays up (touching the screen dismisses it).
alert_hold_sec = 10

# ---------------------------------------------------------------- module 6-2
[notify]
# MQTT broker to publish to: aer-broker on this board. User devices
# (e.g. 192.168.0.162) subscribe to <board address>:1883.
broker_host = 127.0.0.1
broker_port = 1883
# {device} is replaced by the device name.
topic = aer/{device}/event
client_id = aer-notify-{device}
# 0: fire and forget, 1: kept and resent until the broker acknowledges.
qos = 1
keepalive = 30

# ---------------------------------------------------------------- broker
[broker]
# Address and port aer-broker listens on (0.0.0.0: all IPv4 interfaces).
bind = 0.0.0.0
port = 1883
max_clients = 64
