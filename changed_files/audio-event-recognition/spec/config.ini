; ============================================================================
; Configurations for audio event recognition on the CRZ AM62x board
; ============================================================================


[board]
; Board name, to identify board from client device 
name = CRZ AM62x (Linux)


[audio_input]
; Name of the mic, used to find device name
mic_name = COMS CM420


[inference]
; Path to YAMNet TensorFlow Lite model
model_path = /opt/audio-event/yamnet.tflite

; Maximum number of threads TFLite may use
num_threads = 3


[detector]
; Once a class fires an event, the same class is not reported again for
; this many seconds. Applies per class. 0 disables the cooldown.
cooldown_sec = 5


[watched_classes]
; <YAMNet class index> = <threshold>, <class name>
; Indices are 0 - 520: refer to yamnet_class_map.csv
; scores and thresholds are 0.0 - 1.0
; Class names are for displaying and notification.
; Class names do not need to match default names used by YAMNet.
; WIP - run experiments to set suitable threshold values

; --- Sirens ---
390 = 0.40, Siren
391 = 0.40, Civil defense siren
317 = 0.40, Police car (siren)
318 = 0.40, Ambulance (siren)
319 = 0.40, Fire engine, fire truck (siren)

; --- Breaking sounds ---
435 = 0.40, Glass
437 = 0.40, Shatter
463 = 0.40, Smash, crash
464 = 0.40, Breaking

; --- Alarms ---
382 = 0.40, Alarm
393 = 0.40, Smoke detector, smoke alarm
394 = 0.40, Fire alarm
304 = 0.40, Car alarm

[display]
; Seconds the alert screen stays up before returning to the default state.
alert_dismiss_sec = 60


[mqtt]
; configurations for MQTT broker

; user device MQTT clients should connect to this port of the board
broker_port = 1883 

topic       = audio-event
